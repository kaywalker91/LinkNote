<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkNote</title>
<style>
  :root {
    --bg:#f4f7f4; --surface:#ffffff; --ink:#14201a; --ink-soft:#47564e; --ink-faint:#7a887f;
    --line:#dbe4dd; --accent:#1f7a4d; --accent-ink:#155c39; --accent-wash:#e4f1e9;
    --shadow:0 1px 2px rgba(20,32,26,.05), 0 8px 24px -12px rgba(20,32,26,.14);
    --mono: ui-monospace,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root { --bg:#0d120f; --surface:#141b16; --ink:#e6efe8; --ink-soft:#a4b3a9; --ink-faint:#6f7f74;
      --line:#26332a; --accent:#4bbd80; --accent-ink:#8fe0b0; --accent-wash:#16281d;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); }
  }
  :root[data-theme="light"]{ --bg:#f4f7f4; --surface:#ffffff; --ink:#14201a; --ink-soft:#47564e; --ink-faint:#7a887f; --line:#dbe4dd; --accent:#1f7a4d; --accent-ink:#155c39; --accent-wash:#e4f1e9; }
  :root[data-theme="dark"]{ --bg:#0d120f; --surface:#141b16; --ink:#e6efe8; --ink-soft:#a4b3a9; --ink-faint:#6f7f74; --line:#26332a; --accent:#4bbd80; --accent-ink:#8fe0b0; --accent-wash:#16281d; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; display:grid; place-items:center; padding: 40px 24px; }
  .card { width:100%; max-width: 560px; }
  .kicker { font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent-ink); display:inline-flex; align-items:center; gap:9px; margin:0 0 16px; }
  .kicker .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-wash); }
  h1 { font-size: clamp(30px,6vw,42px); letter-spacing:-.02em; margin:0 0 10px; font-weight:780; }
  .tag { color:var(--ink-soft); margin:0 0 34px; font-size:16px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.tile { display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding: 18px 20px;
    box-shadow:var(--shadow); transition: border-color .15s, transform .15s; }
  a.tile:hover { border-color:var(--accent); transform: translateY(-1px); }
  a.tile .em { font-size:24px; flex:none; }
  a.tile .t { font-weight:670; font-size:16px; margin:0; }
  a.tile .d { color:var(--ink-faint); font-size:13.5px; margin:2px 0 0; }
  a.tile .arw { margin-left:auto; color:var(--ink-faint); font-family:var(--mono); }
  footer { margin-top:32px; font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }
</style>
</head>
<body>
  <div class="card">
    <p class="kicker"><span class="dot"></span> LinkNote</p>
    <h1>LinkNote</h1>
    <p class="tag">웹 링크·영상·메모를 한곳에 저장하고 태그·컬렉션·검색으로 정리하는 북마크 앱.</p>
    <div class="links">
      <a class="tile" href="./privacy-policy.html">
        <span class="em">🔒</span>
        <span><span class="t">개인정보 처리방침</span><span class="d">수집 항목·이용 목적·문의처</span></span>
        <span class="arw">→</span>
      </a>
      <a class="tile" href="./play-store-guide.html">
        <span class="em">🚀</span>
        <span><span class="t">Google Play 출시 가이드</span><span class="d">등록 절차 8단계 (운영용)</span></span>
        <span class="arw">→</span>
      </a>
    </div>
    <footer>app.kaywalker.linknote</footer>
  </div>
</body>
</html>
